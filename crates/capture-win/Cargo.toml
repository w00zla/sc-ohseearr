[package]
name = "sc-ohseearr-capture-win"
description = "Live capture of any executable's window on Windows (DXGI duplication, cursor, rest detection, change gate), no Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { workspace = true }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The version and features the Quartermaster companion's capture uses
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
