[package]
name = "sc-ohseearr-core"
description = "OCR engine for Star Citizen screens: text detection, recognition and layout detection on ONNX Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Run models on the GPU through ONNX Runtime's DirectML execution provider (Windows only; needs the
# redistributable DirectML.dll 1.15 next to the executable)
directml = ["ort/directml"]

[dependencies]
ort = { workspace = true }
image = { workspace = true }
fast_image_resize = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
