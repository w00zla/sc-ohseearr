[package]
name = "sc-ohseearr-refinery"
description = "sc-ohseearr reader: refinery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sc-ohseearr-core = { workspace = true }
sc-ohseearr-sc = { workspace = true }

image = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
sc-ohseearr-test-support = { path = "../../crates/test-support" }
image = { workspace = true, features = ["jpeg", "png"] }
serde_json = "1"

# Unique per package: the examples of a workspace share one output folder
[[example]]
name = "regress-refinery"
path = "examples/regress.rs"
