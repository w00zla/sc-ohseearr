[package]
name = "sc-ohseearr-warehouse"
description = "sc-ohseearr reader: warehouse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sc-ohseearr-core = { workspace = true }
sc-ohseearr-sc = { workspace = true }
image = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
sc-ohseearr-test-support = { path = "../../crates/test-support" }
sc-ohseearr-model-sc-warehouse-layout = { path = "../../models/sc-warehouse-layout" }
image = { workspace = true, features = ["jpeg", "png"] }
serde_json = "1"

# Unique per package: the examples of a workspace share one output folder
[[example]]
name = "regress-warehouse"
path = "examples/regress.rs"
