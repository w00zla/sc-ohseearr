id = "sc-rec-latin"
version = "1.0.0"
family = "ctc-rec"
license = "Apache-2.0"
description = "PP-OCRv6 tiny text recognizer cut to 318 Latin characters and fine-tuned on Star Citizen's UI font (Blender Pro)"
source = "Derived from PaddlePaddle/PP-OCRv6_tiny_rec (Apache-2.0); fine-tuned 2026-10-31 (in the Quartermaster companion, before the move to sc-ohseearr)"

# PaddleOCR's recognizer input: BGR, x/127.5 - 1
[input]
order = "bgr"
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]
height = 48
width = 320

[ctc]
dict = "dict.txt"
space_char = true
