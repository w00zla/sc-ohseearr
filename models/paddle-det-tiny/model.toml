id = "paddle-det-tiny"
version = "1.0.0"
family = "db-det"
license = "Apache-2.0"
description = "PaddleOCR PP-OCRv6 tiny text detector, unmodified: where text lines are"
source = "https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_det_onnx/resolve/2ba1506c0380b8f0b03dd142459aac66d4421f6c/inference.onnx (sha256 193bab7a04fca699a6c82e6abb5b81bdb28177f0abd4062552b04908dafb19f8)"

# PaddleX applies the ImageNet mean/std (given in RGB) to the BGR image as it is
[input]
order = "bgr"
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]

# From the model's inference.yml
[db]
thresh = 0.2
box_thresh = 0.4
unclip = 1.4
