# The training pipelines (training/README.md). Versions pinned to the venv they were run with
# (local/detector/.venv, Python 3.11, 2026-11-06). NanoDet itself is a local checkout installed with
# `uv pip install --no-deps -e <checkout>` (README), not a dependency here.
[project]
name = "sc-ohseearr-training"
version = "0.1.0"
description = "Training pipelines and recipes that produce sc-ohseearr model packages"
license = "MIT"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.22.1",
    "huggingface-hub==2.4.0",
    "safetensors==0.8.0",
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "opencv-python==5.0.0.93",
    "numpy==2.4.6",
    "pillow==13.0.0",
    "fonttools==4.68.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
# NanoDet's own requirements (the layout pipeline runs its tools/train.py and tools/export_onnx.py)
layout = [
    "pytorch-lightning==1.9.5",
    "torchmetrics==1.9.0",
    "pycocotools==2.0.11",
    "omegaconf==2.4.0",
    "onnxsim==0.8.1",
    "termcolor==3.3.0",
    "tabulate==0.10.0",
    "matplotlib==3.11.2",
    "tensorboard==2.21.0",
    "imagesize==2.0.1",
    "cython==3.3.0",
    "tqdm==4.70.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
