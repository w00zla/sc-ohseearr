# NanoDet-Plus-m (ShuffleNetV2 1.0x, GhostPAN): the architecture of the `nanodet` family's packages.
# The pipeline fills in what the recipe sets (classes, input size, data, schedule, augmentation, device) and
# writes the result next to the run; keys left as null here always come from the recipe.
save_dir: null
model:
  weight_averager:
    name: ExpMovingAverager
    decay: 0.9998
  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.0x
      out_stages: [2, 3, 4]
      activation: LeakyReLU
    fpn:
      name: GhostPAN
      in_channels: [116, 232, 464]
      out_channels: 96
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: True
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: null
      input_channel: 96
      feat_channels: 96
      stacked_convs: 2
      kernel_size: 5
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
    aux_head:
      name: SimpleConvHead
      num_classes: null
      input_channel: 192
      feat_channels: 192
      stacked_convs: 4
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
data:
  train:
    name: CocoDataset
    img_path: null
    ann_path: null
    input_size: null      # [w, h]
    keep_ratio: False
    pipeline: null
  val:
    name: CocoDataset
    img_path: null
    ann_path: null
    input_size: null
    keep_ratio: False
    pipeline: null
device:
  gpu_ids: [0]
  workers_per_gpu: null
  batchsize_per_gpu: null
  precision: 32
schedule:
  optimizer:
    name: AdamW
    lr: null
    weight_decay: null
  warmup:
    name: linear
    steps: null
    ratio: 0.0001
  total_epochs: null
  lr_schedule:
    name: CosineAnnealingLR
    T_max: null
    eta_min: 0.00005
  val_intervals: null
grad_clip: 35
evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP
log:
  interval: 20
class_names: null
